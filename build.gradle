plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

group = project.mod_group
version = project.mod_version

base {
    archivesName = "${project.mod_id}-${project.mod_flavor}-${project.minecraft_version}-neoforge"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            gameDirectory = project.file('run/client')
            if (project.hasProperty('quickPlayServer')) {
                programArgument '--quickPlayMultiplayer'
                programArgument project.property('quickPlayServer').toString()
            }
        }

        server {
            server()
            gameDirectory = project.file('run/server')
            programArgument '--nogui'
        }

        configureEach {
            logLevel = org.slf4j.event.Level.DEBUG
            def forwardedProperties = [
                'jeiasync.threads',
                'jeiasync.recipeRowCapacity',
                'loadtest.workMs',
                'loadtest.ingredients',
                'loadtest.ingredientBlocks'
            ]
            forwardedProperties.each { key ->
                if (project.hasProperty(key)) {
                    systemProperty key, project.property(key)
                }
            }
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    maven {
        name = 'JEI'
        url = 'https://maven.blamejared.com'
        content {
            includeGroup 'mezz.jei'
            includeGroup 'net.mezzdev.config'
        }
    }
    maven {
        name = 'Sponge'
        url = 'https://maven.spongepowered.org/repository/maven-public/'
        content {
            includeGroup 'org.spongepowered'
        }
    }
}

def minecraftVersion = project.minecraft_version
def jeiVersion = project.jei_version

dependencies {
    // compileOnly is not transitive. The mixins touch JEI internals, so each jar is listed.
    compileOnly "mezz.jei:jei-${minecraftVersion}-neoforge:${jeiVersion}"
    compileOnly "mezz.jei:jei-${minecraftVersion}-common:${jeiVersion}"
    compileOnly "mezz.jei:jei-${minecraftVersion}-lib:${jeiVersion}"
    compileOnly "mezz.jei:jei-${minecraftVersion}-gui:${jeiVersion}"
    compileOnly "mezz.jei:jei-${minecraftVersion}-common-api:${jeiVersion}"
    compileOnly "mezz.jei:jei-${minecraftVersion}-neoforge-api:${jeiVersion}"
    compileOnly 'net.mezzdev.config:mezz_config-1.21.1-neoforge:0.6.3'
    localRuntime "mezz.jei:jei-${minecraftVersion}-neoforge:${jeiVersion}"

    // NeoForge already supplies sponge-mixin, whose CompatibilityLevel includes JAVA_21.
    // A direct Mixin 0.8.5 jar hides that enum and stops at JAVA_18.
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    annotationProcessor files('src/main/resources')
}

def mixinConfigs = 'jeiasync.mixins.json,jeiasync.compat.mixins.json,jeiasync.optional.mixins.json'

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
        minecraft_version      : project.minecraft_version,
        minecraft_version_range: project.minecraft_version_range,
        neo_version            : project.neo_version,
        loader_version_range   : project.loader_version_range,
        neo_version_range      : project.neo_version_range,
        mod_id                 : project.mod_id,
        mod_name               : project.mod_name,
        mod_license            : project.mod_license,
        mod_version            : project.mod_version,
        jei_version_range      : project.jei_version_range,
    ]
    inputs.properties(replaceProperties)
    expand(replaceProperties)
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

def modManifestAttributes = [
    'Specification-Title'   : project.mod_name,
    'Specification-Version' : project.jei_version_range,
    'Implementation-Title'  : project.name,
    'Implementation-Version': project.version,
    'Implementation-Vendor' : project.mod_group,
    'MixinConfigs'          : mixinConfigs,
]

tasks.named('jar', Jar) {
    exclude 'loadtest/**'
    manifest {
        attributes(modManifestAttributes)
    }
}

tasks.register('verifyNoBenchmarkPlugins') {
    dependsOn tasks.named('jar')
    doLast {
        def jarFile = tasks.named('jar').get().archiveFile.get().asFile
        def problems = []
        def zip = new java.util.zip.ZipFile(jarFile)
        try {
            zip.entries().each { entry ->
                if (entry.name.startsWith('loadtest/')) {
                    problems << "contains ${entry.name}"
                } else if (entry.name.endsWith('.class')) {
                    def bytes = zip.getInputStream(entry).withCloseable { it.bytes }
                    if (new String(bytes, 'ISO-8859-1').contains('loadtest/')) {
                        problems << "${entry.name} references the loadtest package"
                    }
                }
            }
        } finally {
            zip.close()
        }
        if (!problems.isEmpty()) {
            throw new GradleException(
                "The shipping jar contains benchmark plugin material: ${problems.join('; ')}.")
        }
        logger.lifecycle('Shipping jar is free of benchmark plugins.')
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyNoBenchmarkPlugins')
}

tasks.register('benchmarkJar', Jar) {
    archiveClassifier = 'benchmark'
    from sourceSets.main.output
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes(modManifestAttributes)
    }
}

tasks.matching { it.name == 'runClient' }.configureEach { dependsOn 'deployBenchmarkJarClient' }
tasks.matching { it.name == 'runServer' }.configureEach { dependsOn 'deployBenchmarkJarServer' }

tasks.register('deployBenchmarkJarClient', Copy) {
    dependsOn 'benchmarkJar'
    from tasks.named('benchmarkJar')
    into layout.projectDirectory.dir('run/client/mods')
}

tasks.register('deployBenchmarkJarServer', Copy) {
    dependsOn 'benchmarkJar'
    from tasks.named('benchmarkJar')
    into layout.projectDirectory.dir('run/server/mods')
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
        excludeDirs += files('run', 'out', 'logs').collect { file(it) }
    }
}

