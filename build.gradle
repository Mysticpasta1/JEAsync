plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

group = project.modGroup
version = project.modVersion

def minecraftVersion = project.minecraftVersion
def modJavaVersion = project.modJavaVersion

base {
    archivesName = "${project.modId}-${minecraftVersion}-forge"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(modJavaVersion)
    }
}

minecraft {
    mappings 'official', minecraftVersion
    copyIdeResources = true
}

repositories {
    maven {
        name = 'Forge'
        url = 'https://maven.minecraftforge.net'
    }
    maven {
        name = 'JEI'
        url = 'https://maven.blamejared.com'
        content {
            includeGroup 'mezz.jei'
            // JEI's own config library dependency
            includeGroup 'net.mezzdev.config'
        }
    }
    maven {
        name = 'Sponge'
        url = 'https://maven.spongepowered.org/repository/maven-public/'
        content {
            includeGroup 'org.spongepowered'
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraftVersion}-${project.forgeVersion}"

    implementation fg.deobf("mezz.jei:jei-${minecraftVersion}-forge:${project.jeiVersion}")

    compileOnly 'org.spongepowered:mixin:0.8.5'
}

tasks.named('processResources', ProcessResources) {
    def props = [
        githubUrl            : project.githubUrl,
        forgeLoaderVersionRange: project.forgeLoaderVersionRange,
        forgeVersionRange    : project.forgeVersionRange,
        minecraftVersionRange: project.minecraftVersionRange,
        modGroup             : project.modGroup,
        modId                : project.modId,
        modJavaVersion       : project.modJavaVersion,
        modName              : project.modName,
        modVersion           : project.modVersion,
        jeiVersionRange      : project.jeiVersionRange,
    ]
    inputs.properties(props)
    filesMatching('META-INF/mods.toml') {
        expand(props)
    }
}

def modManifestAttributes = [
    'Specification-Title'  : project.modName,
    'Specification-Version': project.jeiVersionRange,
    'Implementation-Title' : project.name,
    'Implementation-Version': project.version,
    'Implementation-Vendor': project.modGroup,
    // The mixin config has to be declared here. Forge 1.20.1 has no [[mixins]] section in
    // mods.toml, so without this attribute the config is silently never registered and every
    // mixin in it does nothing.
    //
    // It also means the mod only works when loaded from a jar. Loading it from build/classes
    // plus build/resources, as ForgeGradle dev runs do by default, gives FML no manifest to read
    // and the mixins silently do nothing. Dev runs therefore load the jar instead.
    'MixinConfigs'         : 'jeiasync.mixins.json',
]

tasks.named('jar', Jar) {
    // Synthetic benchmark plugins live in main so that Forge generates annotation scan data for
    // them, but they must never reach the shipped artifact.
    exclude 'loadtest/**'
    manifest {
        attributes(modManifestAttributes)
    }
}

// Same as the shipping jar, but it keeps the synthetic benchmark plugins so there is something
// to measure. Never published; only used to drive the dev runs.
tasks.register('benchmarkJar', Jar) {
    archiveClassifier = 'benchmark'
    from sourceSets.main.output
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes(modManifestAttributes)
    }
}

// ForgeGradle only creates the run tasks late, so they have to be matched lazily.
// Without this the client would launch against whatever jar happens to be lying in mods.
tasks.matching { it.name == 'runClient' }.configureEach { dependsOn 'deployBenchmarkJarClient' }
tasks.matching { it.name == 'runServer' }.configureEach { dependsOn 'deployBenchmarkJarServer' }

// Forwarded to the run JVM. Gradle's own -D flags do not reach a forked JavaExec, so these
// have to arrive as Gradle properties: ./gradlew runServer -Pjeiasync.asyncLoading=false
//
// The mod is NOT declared through the runs DSL. ForgeGradle only accepts a SourceSet there, and
// a source set carries no manifest, so FML would never read the MixinConfigs attribute and every
// mixin would be silently unapplied. Instead the benchmark jar is dropped into each run's mods
// folder, where FML loads it as a real jar and the manifest is honoured.
tasks.register('deployBenchmarkJarClient', Copy) {
    dependsOn 'benchmarkJar'
    from tasks.named('benchmarkJar')
    into layout.projectDirectory.dir('run/client/mods')
}

tasks.register('deployBenchmarkJarServer', Copy) {
    dependsOn 'benchmarkJar'
    from tasks.named('benchmarkJar')
    into layout.projectDirectory.dir('run/server/mods')
}

// ForgeGradle 6 exposes only property() on a RunConfig; there is no systemProperty().
def forwardedProperties = ['jeiasync.asyncLoading', 'jeiasync.threads', 'loadtest.workMs', 'loadtest.ingredients', 'loadtest.ingredientBlocks']

minecraft {
    runs {
        client {
            workingDirectory project.file('run/client')
            property 'forge.logging.console.level', 'debug'
            forwardedProperties.each { key ->
                if (project.hasProperty(key)) {
                    property key, project.getProperty(key)
                }
            }
            // JEI only starts once the client has joined a world, so measuring its load
            // requires auto-connecting rather than sitting on the title screen.
            if (project.hasProperty('quickPlayServer')) {
                args '--quickPlayMultiplayer', project.property('quickPlayServer')
            }
        }
        server {
            workingDirectory project.file('run/server')
            property 'forge.logging.console.level', 'debug'
            forwardedProperties.each { key ->
                if (project.hasProperty(key)) {
                    property key, project.getProperty(key)
                }
            }
        }
    }
}

idea {
    module {
        excludeDirs += files('run', 'out', 'logs').collect { file(it) }
    }
}