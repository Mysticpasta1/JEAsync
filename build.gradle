plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'net.neoforged.moddev' version '2.0.148'
}

group = project.modGroup
version = project.modVersion

def minecraftVersion = project.minecraftVersion
def modJavaVersion = project.modJavaVersion

base {
    archivesName = "${project.modId}-${project.modFlavor}-${minecraftVersion}-neoforge"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(modJavaVersion)
    }
}

def forwardedProperties = ['jeasync.threads']

neoForge {
    version = project.neoforgeVersion

    runs {
        client {
            client()
            gameDirectory = project.file('run/client')
            systemProperty 'forge.logging.console.level', 'debug'
            forwardedProperties.each { key ->
                if (project.hasProperty(key)) {
                    systemProperty key, project.getProperty(key)
                }
            }
            if (project.hasProperty('quickPlayServer')) {
                programArguments.addAll '--quickPlayMultiplayer', project.getProperty('quickPlayServer')
            }
        }
        server {
            server()
            gameDirectory = project.file('run/server')
            systemProperty 'forge.logging.console.level', 'debug'
            forwardedProperties.each { key ->
                if (project.hasProperty(key)) {
                    systemProperty key, project.getProperty(key)
                }
            }
        }
    }

    mods {
        "${project.modId}" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'JEI'
        url = 'https://maven.blamejared.com'
        content {
            includeGroup 'mezz.jei'
            includeGroup 'net.mezzdev.config'
        }
    }
    maven {
        name = 'Sponge'
        url = 'https://repo.spongepowered.org/repository/maven-public/'
        content {
            includeGroup 'org.spongepowered'
        }
    }
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
}

dependencies {
    // JEI 19.76 declares mezz_config as a mandatory mod dependency. It is not nested in the JEI
    // jar, so a dev run needs it on the mod classpath just like a player install does.
    implementation "mezz.jei:jei-${minecraftVersion}-neoforge:${project.jeiVersion}"
    runtimeOnly "net.mezzdev.config:mezz_config-${minecraftVersion}-neoforge:${project.mezzConfigVersion}"
    compileOnly "curse.maven:jei-plus-plus-1645653:${project.jeiPlusPlusFileId}"
    compileOnly "curse.maven:recoleta-1533337:${project.recoletaFileId}"
    compileOnly "curse.maven:mekanism-268560:7904058"
    compileOnly 'org.spongepowered:mixin:0.8.7'
}

tasks.named('processResources', ProcessResources) {
    def props = [
        neoforgeLoaderVersionRange: project.neoforgeLoaderVersionRange,
        neoforgeVersionRange    : project.neoforgeVersionRange,
        minecraftVersionRange   : project.minecraftVersionRange,
        modGroup                : project.modGroup,
        modId                   : project.modId,
        modJavaVersion          : project.modJavaVersion,
        modName                 : project.modName,
        modVersion              : project.modVersion,
        jeiVersionRange         : project.jeiVersionRange,
    ]
    inputs.properties(props)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(props)
    }
}

def modManifestAttributes = [
    'Specification-Title'  : project.modName,
    'Specification-Version': project.jeiVersionRange,
    'Implementation-Title' : project.name,
    'Implementation-Version': project.version,
    'Implementation-Vendor': project.modGroup,
]

tasks.named('jar', Jar) {
    manifest {
        attributes(modManifestAttributes)
    }
}

idea {
    module {
        excludeDirs += files('run', 'out', 'logs').collect { file(it) }
    }
}
