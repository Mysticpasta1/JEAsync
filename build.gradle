plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

group = project.modGroup
version = project.modVersion

def minecraftVersion = project.minecraftVersion
def modJavaVersion = project.modJavaVersion

base {
    archivesName = "${project.modId}-${project.modFlavor}-${minecraftVersion}-forge"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(modJavaVersion)
    }
}

minecraft {
    mappings 'official', minecraftVersion
    copyIdeResources = true
}

repositories {
    maven {
        name = 'Forge'
        url = 'https://maven.minecraftforge.net'
    }
    maven {
        name = 'JEI'
        url = 'https://maven.blamejared.com'
        content {
            includeGroup 'mezz.jei'
            includeGroup 'net.mezzdev.config'
        }
    }
    maven {
        name = 'Sponge'
        url = 'https://maven.spongepowered.org/repository/maven-public/'
        content {
            includeGroup 'org.spongepowered'
        }
    }
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraftVersion}-${project.forgeVersion}"
    implementation fg.deobf("mezz.jei:jei-${minecraftVersion}-forge:${project.jeiVersion}")
    compileOnly fg.deobf("curse.maven:jei-plus-plus-1645653:9060789")
    compileOnly fg.deobf("curse.maven:recoleta-1533337:8178730")
    compileOnly 'org.spongepowered:mixin:0.8.5'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

mixin {
    add sourceSets.main, 'jeasync.refmap.json'
    config 'jeasync.mixins.json'
    config 'jeasync.compat.mixins.json'
    config 'jeasync.compat.default.mixins.json'
    config 'jeasync.optional.mixins.json'
}

tasks.named('processResources', ProcessResources) {
    def props = [
        forgeLoaderVersionRange: project.forgeLoaderVersionRange,
        forgeVersionRange    : project.forgeVersionRange,
        minecraftVersionRange: project.minecraftVersionRange,
        modGroup             : project.modGroup,
        modId                : project.modId,
        modJavaVersion       : project.modJavaVersion,
        modName              : project.modName,
        modVersion           : project.modVersion,
        jeiVersionRange      : project.jeiVersionRange,
    ]
    inputs.properties(props)
    filesMatching('META-INF/mods.toml') {
        expand(props)
    }
}

def modManifestAttributes = [
    'Specification-Title'  : project.modName,
    'Specification-Version': project.jeiVersionRange,
    'Implementation-Title' : project.name,
    'Implementation-Version': project.version,
    'Implementation-Vendor': project.modGroup,
    'MixinConfigs'         : 'jeasync.mixins.json,jeasync.compat.mixins.json,jeasync.compat.default.mixins.json,jeasync.optional.mixins.json',
]

tasks.named('jar', Jar) {
    manifest {
        attributes(modManifestAttributes)
    }
}

def forwardedProperties = ['jeasync.threads']

minecraft {
    runs {
        client {
            workingDirectory project.file('run/client')
            property 'forge.logging.console.level', 'debug'
            forwardedProperties.each { key ->
                if (project.hasProperty(key)) {
                    property key, project.getProperty(key)
                }
            }
            if (project.hasProperty('quickPlayServer')) {
                args '--quickPlayMultiplayer', project.property('quickPlayServer')
            }
        }
        server {
            workingDirectory project.file('run/server')
            property 'forge.logging.console.level', 'debug'
            forwardedProperties.each { key ->
                if (project.hasProperty(key)) {
                    property key, project.getProperty(key)
                }
            }
        }
    }
}

idea {
    module {
        excludeDirs += files('run', 'out', 'logs').collect { file(it) }
    }
}
