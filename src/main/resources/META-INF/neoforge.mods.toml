modLoader="javafml"
loaderVersion="${neoforgeLoaderVersionRange}"

license="The MIT License (MIT)"

[[mods]]
modId="${modId}"
version="${modVersion}"
displayName="${modName}"
displayTest="IGNORE_ALL_VERSION"
description='''
Mixin-based add-on for JEI. Not a fork: it requires upstream JEI and patches it at runtime with
mixins, running plugin registration off the main thread to speed up startup.
'''

[[dependencies.${modId}]]
    modId="neoforge"
    type="required"
    versionRange="${neoforgeVersionRange}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${modId}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraftVersionRange}"
    ordering="NONE"
    side="BOTH"

# Pinned tightly: the mixins overwrite internal methods that JEI's API contract
# does not cover, so a different JEI release is not safe to load against.
[[dependencies.${modId}]]
    modId="jei"
    type="required"
    versionRange="${jeiVersionRange}"
    ordering="AFTER"
    side="BOTH"

[[mixins]]
config="jeasync.mixins.json"

[[mixins]]
config="jeasync.compat.default.mixins.json"

[[mixins]]
config="jeasync.mekanism.mixins.json"

[[mixins]]
config="jeasync.astralsorcery.mixins.json"
